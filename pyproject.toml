[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "core-rag"
version = "0.1.0"
description = "An explicit, zero-magic, evaluation-driven RAG framework."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = [
    "pydantic>=2.6.0",
    "pydantic-settings>=2.2.0",
    "httpx>=0.27.0",
    "tiktoken>=0.6.0",
    "opentelemetry-api>=1.22.0",
]

[project.optional-dependencies]
qdrant = ["qdrant-client>=1.8.0"]
lancedb = ["lancedb>=0.6.0"]
eval = ["ragas>=0.1.0", "numpy>=1.26.0"]
all = [
    "core-rag[qdrant,lancedb,eval]",
]

[tool.ruff]
target-version = "py311"
line-length = 100
select = ["E", "F", "I", "N", "UP", "ASYNC", "B"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]